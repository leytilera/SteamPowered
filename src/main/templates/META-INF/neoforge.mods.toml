modLoader="javafml"
loaderVersion="${loader_version_range}" 
license="GPLv3"
issueTrackerURL = "https://git.tilera.org/Anvilcraft/SteamPowered/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="[Anvilcraft] tilera, [TeamMoeg] YueSha, khjxiaogu, goumo_g"

# The description text for the mod (multi line!) (#mandatory)
description='''
Expanding Create mod to the Steam Age.

Developers: YueSha, khjxiaogu, tilera
Artists: goumo_g

Contributors (in no particular order):
MRH0, SpottyTheTurtle, jetpacker06, and all Contributors on GitHub.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    # Side this dependency is applied on - BOTH, CLIENT, or SERVER
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    mandatory=true
    versionRange="[6.0.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="flywheel"
    mandatory=true
    versionRange="[1.0.0,)"
    ordering="AFTER"
    side="CLIENT"